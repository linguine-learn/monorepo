services:
  postgres:
    image: docker.io/postgres:17-alpine
    shm_size: 256mb
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=linguine
      - POSTGRES_PASSWORD=linguine
    volumes:
      - linguine-postgres:/var/lib/postgresql/data
volumes:
  linguine-postgres:
    driver: local
